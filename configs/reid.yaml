project:
  name: AMFTrack-ReID
  seed: 42

data:
  image_height: 256
  image_width: 128
  workers: 4

training:
  batch_size: 64
  max_iterations: 180000
  initial_lr: 0.00005
  weight_decay: 0.0005
  triplet_margin: 0.3
  triplet_weight: 1.0
  classification_weight: 1.0
  log_interval: 100
  save_interval: 10000

model:
  osnet_feature_dim: 512
  gf_feature_dim: 512
  gf_backbone: resnet50
