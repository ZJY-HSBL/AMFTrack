name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy scipy pytest
      - run: pytest -q tests/test_ciou.py tests/test_fsa.py tests/test_assignment.py tests/test_tracker_synthetic.py
